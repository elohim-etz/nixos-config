name: Update flake.lock (auto-push on success)

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update-test-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(-source$|\\.tar\\.gz$|\\.tar\\.xz$)"

      - name: Update flake.lock
        run: nix flake update

      - name: Check whether anything actually changed
        id: diff
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test-build system + home-manager closures
        if: steps.diff.outputs.changed == 'true'
        run: |
          nix build .#nixosConfigurations.nixos.config.system.build.toplevel --print-build-logs
          nix build .#homeConfigurations.naveen.activationPackage --print-build-logs

      - name: Build every cache target
        if: steps.diff.outputs.changed == 'true'
        run: |
          for pkg in $(nix eval --json --apply builtins.attrNames .#packages.x86_64-linux | jq -r '.[]'); do
            echo "::group::$pkg"
            nix build ".#packages.x86_64-linux.$pkg" --print-build-logs
            echo "::endgroup::"
          done

      - name: Commit and push flake.lock
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake.lock: update inputs"
          git push origin HEAD:main
