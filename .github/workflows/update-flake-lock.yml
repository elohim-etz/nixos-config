name: Update flake.lock and test rebuild

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(-source$|\\.tar\\.gz$|\\.tar\\.xz$)"

      - name: Update flake.lock
        run: nix flake update

      - name: Test-build system + home-manager closures
        run: |
          nix build .#nixosConfigurations.nixos.config.system.build.toplevel --print-build-logs
          nix build .#homeConfigurations.naveen.activationPackage --print-build-logs

      - name: Pre-warm cache targets against updated inputs
        run: |
          for pkg in $(nix eval --json --apply builtins.attrNames .#packages.x86_64-linux | jq -r '.[]'); do
            echo "::group::$pkg"
            nix build ".#packages.x86_64-linux.$pkg" --print-build-logs
            echo "::endgroup::"
          done

      - name: Open or update the PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "flake.lock: update inputs"
          title: "flake.lock: automated update"
          body: |
            Automated nightly `nix flake update`.

            The full NixOS system closure and the `naveen` home-manager
            closure were both successfully built against this updated
            `flake.lock` before this PR was opened — merging should
            rebuild cleanly.
          branch: automated/flake-update
          delete-branch: false
          labels: |
            automated
            flake-update
