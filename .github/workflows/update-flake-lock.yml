name: update-flake-lock

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nix-build
  cancel-in-progress: false

env:
  HOST: laptop

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix
        with:
          cachix-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Lockfile health
        uses: DeterminateSystems/flake-checker-action@main
        with:
          fail-mode: false

      - name: Update flake.lock
        run: nix flake update

      # - name: Update custom packages
      #   continue-on-error: true
      #   run: nix run nixpkgs#nix-update -- --flake stremio-linux-shell

      - run: nix flake check --print-build-logs

      - name: Build kernel
        run: |
          nix build ".#nixosConfigurations.${HOST}.config.boot.kernelPackages.kernel^*" \
            --no-link --print-build-logs

      - name: Build system
        run: |
          nix build ".#nixosConfigurations.${HOST}.config.system.build.toplevel" \
            --no-link --print-build-logs

      - name: Open PR
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "flake.lock: update inputs"
          title: "flake.lock: automated update"
          body: "Automated `nix flake update`. Kernel and system built and cached."
          branch: automated/flake-update
          labels: |
            automated
            flake-update
