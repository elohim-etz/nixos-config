name: Update flake.lock, test rebuild and cache packages

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.cpr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(-source$|\\.tar\\.gz$|\\.tar\\.xz$)"

      - name: Update flake.lock
        run: nix flake update

      - name: Test-build system + home-manager closures
        run: |
          nix build .#nixosConfigurations.wasabi.config.system.build.toplevel --print-build-logs --no-link
          nix build .#homeConfigurations.naveen.activationPackage --print-build-logs --no-link

      - name: Open or update the PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "flake.lock: update inputs"
          title: "flake.lock: automated update"
          body: "Automated nix flake update, builds passed."
          branch: automated/flake-update
          delete-branch: false
          labels: |
            automated
            flake-update
