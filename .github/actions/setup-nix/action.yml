name: Setup Nix + Cachix
description: Free disk space, install Nix, enable the binary cache
inputs:
  cachix-name:
    description: Cachix cache name
    required: true
  cachix-token:
    description: Cachix auth token (empty on fork PRs = read-only)
    required: false
    default: ""
runs:
  using: composite
  steps:
    # - uses: jlumbroso/free-disk-space@v1.3.1
    #   with:
    #     tool-cache: false
    #     android: true
    #     dotnet: true
    #     haskell: true
    #     docker-images: true
    #     large-packages: false
    #     swap-storage: false

    - uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: |
          max-jobs = auto
          cores = 0

    - uses: cachix/cachix-action@v17
      with:
        name: ${{ inputs.cachix-name }}
        authToken: ${{ inputs.cachix-token }}
        pushFilter: "(-source$|\\.tar\\.gz$|\\.tar\\.xz$)"
